name: TGK tools checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install framework from default branch
        run: |
          git clone --depth=1 https://github.com/jerrecode/tgk.git /tmp/tgk
          make -C /tmp/tgk build
          python -m pip install --no-deps /tmp/tgk
      - name: Install tools
        run: python -m pip install --no-deps -e .
      - name: Tests and static checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q tgk_tools
          sh -n install.sh
      - name: Smoke-test tools installer and CLI
        run: |
          python -m pip install setuptools
          sh ./install.sh
          cd /tmp
          tgk --help
          tgk doctor --json
      - name: Build offline source installer archive
        run: python scripts/build_bundle.py --tgk-source /tmp/tgk --out tgk_bundle_v0.3.0.tar.gz
      - name: Verify offline archive installation after deleting extracted sources
        run: python scripts/check_bundle_install.py tgk_bundle_v0.3.0.tar.gz
      - name: Upload downloadable source installer
        uses: actions/upload-artifact@v4
        with:
          name: tgk-offline-installer
          path: tgk_bundle_v0.3.0.tar.gz
          if-no-files-found: error
