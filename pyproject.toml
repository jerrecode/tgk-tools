[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgk-tools"
version = "0.6.7"
description = "Shell-first Android GUIs based on TGK and Termux:GUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["tgk>=0.6.7"]

[project.scripts]
tgk = "tgk_tools.cli:main"
tgk-tools = "tgk_tools.cli:main"

[tool.setuptools.packages.find]
include = ["tgk_tools*"]
